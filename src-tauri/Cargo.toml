[package]
name = "aion-party-meter"
version = "0.1.10"
description = "AionPartyMeter - statistiques du groupe entier pour Aion 2"
authors = ["AionPartyMeter contributors", "taengu (upstream parser)"]
license = "GPL-3.0-only"
edition = "2024"
default-run = "AionPartyMeter"
autobins = false

[lib]
name = "a2tools_dps_meter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "AionPartyMeter"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:libloading", "dep:tokio", "dep:tracing-subscriber"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = { version = "0.8", optional = true }
lz4_flex = "0.11"
tokio = { version = "1", features = ["full"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
sha2 = "0.11.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
 "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading",
 "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory",
 "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Shell"
] }

[dev-dependencies]
flate2 = "1"

[profile.release]
opt-level = 2
strip = true

[[bin]]
name = "apm-replay"
path = "src/bin/apm-replay.rs"
